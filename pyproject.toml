[project]
name = "idleon-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyautogui==0.9.54",
    "mss==9.0.2",
    "opencv-python==4.9.0.80",
    "Pillow==10.3.0",
    "numpy==1.26.4",
    "pytesseract>=0.3.10",
    "plyvel-ci>=1.5.1; sys_platform == 'win32'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pynput>=1.7",
    "scikit-learn>=1.4",
    # IANA tz database. Windows ships no system zoneinfo, so without this
    # the Europe/Stockholm push-window lookup in common/auto_commit.py
    # always raises and silently falls back to naive system-local time
    # (#49). Pure-python and harmless on Unix; included unconditionally so
    # the zone-aware path is robust to the host TZ (CI/cron/second machine).
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Used by tests/test_lint.py â€” narrow correctness checks (undefined
    # name, unused variable). NOT a full style linter; we only enable
    # the F-codes that catch real bugs without being opinionated.
    "pyflakes>=3.0",
]

[project.scripts]
idleon = "ui.launcher:run"
hoops = "minigames.hoops.main:run"
hoops-observe = "minigames.hoops.observe:run"
hoops-capture = "minigames.hoops.capture:run"
hoops-debug = "minigames.hoops.debug_match:run"
hoops-ball-calibrate = "minigames.hoops.ball_calibrate:run"
hoops-score-calibrate = "minigames.hoops.score_calibrate:run"
hoops-pick-score-region = "minigames.hoops.pick_score_region:run"
hoops-pick-game-over = "minigames.hoops.pick_game_over:run"
hoops-pick-lives-region = "minigames.hoops.pick_lives_region:run"
chopping = "minigames.chopping.main:run"
chopping-observe = "minigames.chopping.observe:run"
chopping-calibrate = "minigames.chopping.calibrate:run"
chopping-pick-bar-region = "minigames.chopping.pick_bar_region:run"
chopping-pick-button-region = "minigames.chopping.pick_button_region:run"
chopping-pick-leaf-region = "minigames.chopping.pick_leaf_region:run"
chopping-pick-game-over = "minigames.chopping.pick_game_over:run"
chopping-pick-score-region = "minigames.chopping.pick_score_region:run"
darts = "minigames.darts.main:run"
darts-observe = "minigames.darts.observe:run"
darts-capture = "minigames.darts.capture:run"
darts-pick-release = "minigames.darts.pick_release:run"
darts-auto-crop-release = "minigames.darts.auto_crop_release:run"
darts-pick-wind-region = "minigames.darts.pick_wind_region:run"
darts-watch-wind = "minigames.darts.watch_wind:run"
darts-pick-score-region = "minigames.darts.pick_score_region:run"
darts-pick-game-over = "minigames.darts.pick_game_over:run"
catching = "minigames.catching.main:run"
catching-observe = "minigames.catching.observe:run"
catching-capture = "minigames.catching.capture:run"
catching-pick-play-region = "minigames.catching.pick_play_region:run"
catching-pick-score-region = "minigames.catching.pick_score_region:run"
catching-extract-fly = "minigames.catching.auto_extract_fly:run"
catching-capture-digits = "minigames.catching.capture_digits:run"
catching-fit-dynamics = "minigames.catching.fit_dynamics:run"
catching-sim = "minigames.catching.sim:run"
mining = "minigames.mining.main:run"
mining-observe = "minigames.mining.observe:run"
mining-capture = "minigames.mining.capture:run"
mining-pick-play-region = "minigames.mining.pick_play_region:run"
mining-trace = "minigames.mining.trace:run"
mining-pick-start-button = "minigames.mining.pick_start_button:run"
mining-render-overlay = "minigames.mining.render_overlay:run"
fishing = "minigames.fishing.main:run"
fishing-observe = "minigames.fishing.observe:run"
